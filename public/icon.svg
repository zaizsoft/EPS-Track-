<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Subtle outer track ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#10b981" stroke-opacity="0.22" stroke-width="14" />
  <circle cx="256" cy="256" r="154" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="8" stroke-dasharray="28 16" />
  <!-- Stopwatch top crown -->
  <rect x="228" y="64" width="56" height="22" rx="10" fill="url(#accentGrad)" />
  <rect x="246" y="84" width="20" height="20" fill="#10b981" />
  <!-- Main sport crest circle -->
  <circle cx="256" cy="264" r="122" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="16" />
  <!-- Dynamic check / athletic track swoosh -->
  <path
    d="M196 268 L238 310 L322 214"
    fill="none"
    stroke="#ffffff"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Small speed pulse dot -->
  <circle cx="338" cy="182" r="16" fill="#34d399" />
</svg>
